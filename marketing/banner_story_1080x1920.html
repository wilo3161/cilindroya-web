<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner Story / Reel (1080x1920) — CilindroYa</title>
  
  
  
  
<link rel="icon" href="/static/favicon.ico?v=corporate-all-20261004" sizes="any"><link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=corporate-all-20261004"><link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=corporate-all-20261004"><link rel="apple-touch-icon" sizes="180x180" href="/static/brand/icon-180.png?v=corporate-all-20261004">
<link rel="stylesheet" href="/static/brand/brand.css?v=corporate-all-20261004">
<style>.cy-material-logo{display:block;width:220px;max-width:100%;height:auto;object-fit:contain}.flyer-card .cy-material-logo{margin:8px auto}.cy-material-logo{break-inside:avoid}@media print{.cy-material-logo{display:block!important;max-width:55mm;height:auto!important}}</style>  <link rel="stylesheet" href="/static/brand/tw/marketing-banner-story-1080x1920.css?v=74fd197b21" data-tw>
</head>
<body class="bg-slate-900 min-h-screen p-6 flex flex-col items-center justify-center font-sans antialiased text-white">
<div class="cy-corporate-bar"><a href="/hogar/" aria-label="CilindroYa, inicio"><img class="cy-logo cy-corporate-logo" src="/static/brand/logo-color.svg?v=corporate-all-20261004" alt="CilindroYa" width="430" height="120"></a></div>

  <div class="mb-4 flex space-x-3">
    <a href="/marketing" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 transition">
      Volver al Centro de Marketing ➔
    </a>
  </div>

  <!-- Contenedor del Story 1080x1920 (Escalado visual a 360x640 para pantalla) -->
  <div class="w-[360px] h-[640px] bg-gradient-to-b from-slate-950 via-sky-950 to-slate-950 border-4 border-sky-500 rounded-3xl p-6 shadow-2xl relative overflow-hidden flex flex-col justify-between text-center">
    
    <!-- Glows -->
    <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-48 h-48 bg-sky-500/25 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 w-48 h-48 bg-cyan-500/25 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <div class="space-y-2 z-10 pt-2">
      <div class="inline-flex items-center space-x-2 bg-sky-500/20 border border-sky-400/40 px-3 py-1 rounded-full text-[10px] font-black text-sky-300">
        <span>📍 IBARRA & IMBABURA</span>
      </div>
      <img class="cy-material-logo" style="background:white;border-radius:8px;padding:6px 8px" src="/static/brand/logo-color.svg?v=legal-marketing-20261004" alt="CilindroYa" width="430" height="120">
    </div>

    <!-- Mensaje Central -->
    <div class="space-y-3 z-10 my-auto">
      <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-sky-600 to-sky-400 flex items-center justify-center text-4xl shadow-xl shadow-sky-500/40 animate-bounce">
        🔥
      </div>
      <h1 class="text-2xl font-black text-white leading-tight">
        ¡Pide gas a distribuidores de tu sector!
      </h1>
      <p class="text-xs text-slate-300 font-medium leading-relaxed px-2">
        Abre el link o escanea el QR y el camión de tu sector atiende según disponibilidad.
      </p>

      <!-- Badge de Precio -->
      <div class="inline-block bg-slate-900/90 border border-slate-700 px-5 py-2.5 rounded-2xl">
        <span class="text-[9px] text-slate-400 font-bold uppercase block">Cilindro 15kg</span>
        <span class="text-3xl font-black text-emerald-400">Consultar precio</span>
      </div>
    </div>

    <!-- Bottom QR & Call to Action -->
    <div class="space-y-3 z-10 pb-2">
      <div class="bg-white p-3 rounded-2xl text-slate-900 inline-flex items-center space-x-3 shadow-xl">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=https://gas-azul-production.up.railway.app/cliente" alt="QR" class="w-16 h-16">
        <div class="text-left text-[10px] font-black leading-tight">
          <span>ESCANEA EL QR</span><br>
          <span class="text-sky-600 text-xs">PIDE AHORA</span><br>
          <span>EN 1 TOQUE ➔</span>
        </div>
      </div>

      <div class="text-[11px] font-bold text-slate-400">
        💬 WhatsApp: <strong class="text-white">099 305 2744</strong>
      </div>
    </div>

  </div>

</body>
</html>
